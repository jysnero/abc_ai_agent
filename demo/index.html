<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OX Quiz - Browser Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="module">
    import React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

    // 템플릿 테스트용 고정 App (Claude 생성 버전 대기)
    function App() {
      const [currentQ, setCurrentQ] = React.useState(0);
      const [answers, setAnswers] = React.useState([null, null, null]);
      const [score, setScore] = React.useState(0);
      const [complete, setComplete] = React.useState(false);

      const questions = [
        { q: "O와 X를 선택합니다?", correct: true, explain: "맞습니다" },
        { q: "React는 라이브러리인가?", correct: true, explain: "맞습니다" },
        { q: "JavaScript는 1990년대 시작?", correct: true, explain: "맞습니다" }
      ];

      const handleAnswer = (isTrue) => {
        const correct = questions[currentQ].correct === isTrue;
        const newAnswers = [...answers];
        newAnswers[currentQ] = isTrue;
        setAnswers(newAnswers);
        if (correct) setScore(score + 10);
        if (currentQ < 2) {
          setCurrentQ(currentQ + 1);
        } else {
          setComplete(true);
        }
      };

      const handleRetry = () => {
        setCurrentQ(0);
        setAnswers([null, null, null]);
        setScore(0);
        setComplete(false);
      };

      return React.createElement('div', { className: 'flex items-center justify-center min-h-screen bg-gray-100 p-4' },
        React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-6 w-full max-w-md' },
          !complete ? (
            React.createElement(React.Fragment, {},
              React.createElement('div', { className: 'mb-4' },
                React.createElement('p', { className: 'text-sm text-gray-600' }, `${currentQ + 1}/3`),
                React.createElement('div', { className: 'w-full bg-gray-300 h-2 rounded' },
                  React.createElement('div', { className: 'bg-blue-500 h-2 rounded', style: { width: `${((currentQ + 1) / 3) * 100}%` } })
                )
              ),
              React.createElement('h2', { className: 'text-xl font-bold mb-4' }, questions[currentQ].q),
              React.createElement('div', { className: 'flex gap-2' },
                React.createElement('button', {
                  onClick: () => handleAnswer(true),
                  className: 'flex-1 bg-blue-500 text-white py-2 rounded hover:bg-blue-600',
                  disabled: answers[currentQ] !== null
                }, 'O (참)'),
                React.createElement('button', {
                  onClick: () => handleAnswer(false),
                  className: 'flex-1 bg-red-500 text-white py-2 rounded hover:bg-red-600',
                  disabled: answers[currentQ] !== null
                }, 'X (거짓)')
              )
            )
          ) : (
            React.createElement(React.Fragment, {},
              React.createElement('h2', { className: 'text-2xl font-bold mb-4' }, `최종 점수: ${score}점`),
              React.createElement('p', { className: 'text-gray-600 mb-4' }, `${score / 10}/3 정답`),
              React.createElement('button', {
                onClick: handleRetry,
                className: 'w-full bg-green-500 text-white py-2 rounded hover:bg-green-600'
              }, '다시하기')
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
